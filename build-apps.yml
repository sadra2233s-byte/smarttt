name: Build Desktop & Android Binaries (Tauri v2)

on:
  push:
    branches:
      - main
      - master
  push:
    tags:
      - 'v*'
  workflow_dispatch:


# Grants permissions needed to create GitHub Releases and upload artifacts
permissions:
  contents: write

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'ubuntu-22.04' && 'x86_64-unknown-linux-gnu' || (matrix.platform == 'windows-latest' && 'x86_64-pc-windows-msvc' || 'aarch64-apple-darwin') }}

      - name: Install Linux build dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Build Web Frontend (Vite)
        run: npm run build

      - name: Build Desktop Executable (Tauri v2 Action)
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ github.ref_name }}
          releaseName: 'App Release v${{ github.ref_name }}'
          releaseBody: 'Automated desktop build generated by GitHub Actions for commit ${{ github.sha }}'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.platform == 'ubuntu-22.04' && 'x86_64-unknown-linux-gnu' || (matrix.platform == 'windows-latest' && 'x86_64-pc-windows-msvc' || 'aarch64-apple-darwin') }}

      - name: Upload Build Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: MyCoolApp-desktop-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: ignore

  build-android:
    name: Build Android APK (Tauri v2)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Rust & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Install NDK
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0"

      - name: Setup Node.js & Install Dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci || npm install
      - run: npm run build

      - name: Init & Build Android APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
        run: |
          npx tauri android init --skip-init-check || true
          npx tauri android build --apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyCoolApp-Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
