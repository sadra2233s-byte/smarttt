<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradients for realistic 3D leather cover -->
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffcc00" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    
    <linearGradient id="spineShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.4)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0)" />
    </linearGradient>

    <linearGradient id="bandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Drop Shadow for 3D depth -->
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#3d1800" flood-opacity="0.45" />
    </filter>

    <filter id="innerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset dx="0" dy="4"/>
      <feGaussianBlur stdDeviation="4" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#000" flood-opacity="0.3" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Outer 3D Base Shadow & Squircle Container -->
  <g filter="url(#dropShadow)" transform="translate(0, 10)">
    <!-- Book Back / Spine Extension Wrapper -->
    <rect x="48" y="24" width="416" height="432" rx="96" fill="#92400e" />
    
    <!-- Notebook Pages Stack visible at bottom -->
    <g transform="translate(64, 340)">
      <path d="M 0 0 C 0 0 100 24 192 24 C 284 24 384 0 384 0 L 384 64 C 384 76 374 86 362 86 L 22 86 C 10 86 0 76 0 64 Z" fill="url(#pageGrad)" />
      <!-- Page lines / shadows -->
      <path d="M 12 20 L 372 20 M 12 40 L 372 40 M 12 60 L 372 60" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6" />
    </g>

    <!-- Main Front Leather Cover -->
    <rect x="56" y="24" width="400" height="400" rx="88" fill="url(#coverGrad)" />

    <!-- Spine shadow curve on left -->
    <path d="M 56 112 C 56 68 92 32 136 32 L 136 424 L 56 424 Z" fill="url(#spineShadow)" />

    <!-- Leather Stitching Border (Dotted stroke) -->
    <rect x="76" y="44" width="360" height="360" rx="72" fill="none" stroke="#fef3c7" stroke-width="3" stroke-dasharray="10 8" stroke-opacity="0.85" />

    <!-- Engraved Checkmark in Center -->
    <g transform="translate(180, 170)">
      <!-- Shadow/Dark inner for engraved effect -->
      <path d="M 45 105 L 85 145 L 155 65" fill="none" stroke="#78350f" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.35" transform="translate(0, 4)" />
      <!-- Highlighted inner edge -->
      <path d="M 45 105 L 85 145 L 155 65" fill="none" stroke="#fef3c7" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.6" transform="translate(0, -2)" />
      <!-- Main engraved check path -->
      <path d="M 45 105 L 85 145 L 155 65" fill="none" stroke="#b45309" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Vertical Elastic Bookmark Band on Right -->
    <g transform="translate(390, 16)">
      <rect x="0" y="0" width="36" height="420" rx="18" fill="url(#bandGrad)" />
      <!-- Elastic ribbed lines -->
      <line x1="0" y1="40" x2="36" y2="40" stroke="#78350f" stroke-width="3" stroke-opacity="0.4" />
      <line x1="0" y1="80" x2="36" y2="80" stroke="#78350f" stroke-width="3" stroke-opacity="0.4" />
      <line x1="0" y1="120" x2="36" y2="120" stroke="#78350f" stroke-width="3" stroke-opacity="0.4" />
      <line x1="0" y1="160" x2="36" y2="160" stroke="#78350f" stroke-width="3" stroke-opacity="0.4" />
      <line x1="0" y1="200" x2="36" y2="200" stroke="#78350f" stroke-width="3" stroke-opacity="0.4" />
      <line x1="0" y1="240" x2="36" y2="240" stroke="#78350f" stroke-width="3" stroke-opacity="0.4" />
      <line x1="0" y1="280" x2="36" y2="280" stroke="#78350f" stroke-width="3" stroke-opacity="0.4" />
      <line x1="0" y1="320" x2="36" y2="320" stroke="#78350f" stroke-width="3" stroke-opacity="0.4" />
      <line x1="0" y1="360" x2="36" y2="360" stroke="#78350f" stroke-width="3" stroke-opacity="0.4" />
    </g>
  </g>
</svg>
