<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="plannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- PWA Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#plannerBg)" />

  <!-- Subtle background accent circle -->
  <circle cx="256" cy="256" r="170" fill="#ffffff" fill-opacity="0.06" />

  <!-- Central Planner / Checklist Document Shape with Drop Shadow -->
  <g filter="url(#iconShadow)" transform="translate(116, 96)">
    <!-- Main Notebook/Planner Card -->
    <rect x="0" y="0" width="280" height="320" rx="28" fill="#ffffff" />
    
    <!-- Planner Header Bar (Emerald accent) -->
    <path d="M 0 28 A 28 28 0 0 1 28 0 L 252 0 A 28 28 0 0 1 280 28 L 280 72 L 0 72 Z" fill="#10b981" />

    <!-- Calendar Ring Binding Dots -->
    <circle cx="84" cy="0" r="10" fill="#047857" />
    <circle cx="196" cy="0" r="10" fill="#047857" />

    <!-- Checklist Item 1 (Completed with Checkmark) -->
    <rect x="36" y="104" width="32" height="32" rx="8" fill="#d1fae5" />
    <path d="M 44 120 L 52 128 L 64 112" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="84" y="110" width="130" height="20" rx="6" fill="#e5e7eb" />

    <!-- Checklist Item 2 (In Progress / Active) -->
    <rect x="36" y="164" width="32" height="32" rx="8" fill="#ecfdf5" />
    <circle cx="52" cy="180" r="6" fill="#10b981" />
    <rect x="84" y="170" width="160" height="20" rx="6" fill="#374151" />

    <!-- Checklist Item 3 (Pending) -->
    <rect x="36" y="224" width="32" height="32" rx="8" fill="#f3f4f6" />
    <rect x="84" y="230" width="100" height="20" rx="6" fill="#9ca3af" />
  </g>
</svg>
