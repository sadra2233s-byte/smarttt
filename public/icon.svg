<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Full Bleed for Maskable Icon) -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>

    <!-- 3D Shadow under Notebook -->
    <filter id="notebook3dShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="16" flood-color="#451a03" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#291002" flood-opacity="0.3" />
    </filter>

    <!-- Debossed / Inset Shadow for 3D Checkmark -->
    <filter id="debossEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy="3"/>
      <feGaussianBlur stdDeviation="3" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#78350f" flood-opacity="0.8" result="color"/>
      <feComposite operator="in" in2="inverse" result="shadow"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>

    <!-- Elastic Strap Shadow -->
    <filter id="strapShadow" x="-30%" y="-10%" width="160%" height="130%">
      <feDropShadow dx="-3" dy="3" stdDeviation="4" flood-color="#451a03" flood-opacity="0.45" />
    </filter>

    <!-- Leather Cover Gradient -->
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="20%" stop-color="#fef08a" />
      <stop offset="55%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Checkmark Inner Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="60%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Book Pages Stack Gradient -->
    <linearGradient id="paperStackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f8fafc" />
      <stop offset="80%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Elastic Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Specular Light Reflection -->
    <linearGradient id="specularSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- 1. FULL CANVAS MASKABLE BACKGROUND (Prevents Android cropping/white space bugs) -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)" />

  <!-- Background Ambient Glow -->
  <circle cx="256" cy="240" r="210" fill="#fef08a" opacity="0.12" />

  <!-- 2. CENTERED 3D NOTEBOOK (Kept within 70% safe zone: x=96..416, y=96..416) -->
  <g filter="url(#notebook3dShadow)">

    <!-- 3D Book Pages Stack (Bottom 3D Thickness) -->
    <path d="M 132 355 Q 256 380 380 355 L 368 392 Q 256 410 144 392 Z" fill="url(#paperStackGrad)" />
    <path d="M 136 365 Q 256 386 376 365" stroke="#cbd5e1" stroke-width="2.5" fill="none" opacity="0.9" />
    <path d="M 140 375 Q 256 394 372 375" stroke="#94a3b8" stroke-width="2" fill="none" opacity="0.75" />
    <path d="M 144 384 Q 256 401 368 384" stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.6" />

    <!-- Main Leather Notebook Cover -->
    <rect x="106" y="106" width="300" height="268" rx="54" fill="url(#leatherGrad)" />

    <!-- Specular Glass Sheen Overlay -->
    <rect x="106" y="106" width="300" height="135" rx="54" fill="url(#specularSheen)" />

    <!-- Stitched Leather Border -->
    <rect x="120" y="120" width="272" height="240" rx="42" 
          fill="none" 
          stroke="#78350f" 
          stroke-width="2.5" 
          stroke-dasharray="6 5" 
          opacity="0.65" />

    <!-- 3D Debossed Center Checkmark -->
    <g filter="url(#debossEffect)">
      <!-- Bevel Light Highlight -->
      <path d="M 220 238 L 248 266 L 302 202" 
            fill="none" 
            stroke="#fef08a" 
            stroke-width="28" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            opacity="0.7" 
            transform="translate(0, 2)" />
      
      <!-- Main Checkmark Path -->
      <path d="M 220 238 L 248 266 L 302 202" 
            fill="none" 
            stroke="url(#checkGrad)" 
            stroke-width="24" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
    </g>

    <!-- 3D Elastic Bookmark Ribbon (Right side) -->
    <g filter="url(#strapShadow)">
      <path d="M 338 100 C 340 100 358 100 360 100 L 348 388 C 346 388 330 388 328 388 Z" fill="url(#ribbonGrad)" />
      <!-- Ribbed Texture Lines on Strap -->
      <path d="M 336 100 L 328 388 M 342 100 L 334 388 M 348 100 L 340 388 M 354 100 L 346 388" 
            stroke="#451a03" 
            stroke-width="1" 
            opacity="0.35" />
    </g>

    <!-- Outer Rim Metallic Highlight -->
    <rect x="106" y="106" width="300" height="268" rx="54" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="2" 
          opacity="0.5" />

  </g>
</svg>
