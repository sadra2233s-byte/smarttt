<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- White PWA Install Icon Squircle Background -->
  <rect width="512" height="512" rx="116" fill="#ffffff" />

  <!-- Exact match of user reference icon -->
  <g filter="url(#cardShadow)" transform="translate(80, 80) scale(0.68)">
    <!-- Left Column (Top & Bottom segments) -->
    <rect x="0" y="0" width="120" height="360" rx="36" fill="#047857" />
    <rect x="0" y="240" width="120" height="120" rx="36" fill="#065f46" />

    <!-- Middle Column -->
    <rect x="144" y="0" width="120" height="240" rx="36" fill="#10b981" />

    <!-- Right Column -->
    <rect x="288" y="0" width="120" height="200" rx="36" fill="#34d399" />
  </g>
</svg>
