<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Outer circular badge gradient -->
    <radialGradient id="badgeBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="70%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </radialGradient>
    <linearGradient id="ringGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>
    
    <!-- Planner shadow -->
    <filter id="plannerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0369a1" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Circular Badge Background -->
  <circle cx="256" cy="256" r="230" fill="url(#badgeBg)" stroke="url(#ringGlow)" stroke-width="8" />
  
  <!-- Soft internal ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6" />

  <!-- Main Planner Icon Group -->
  <g filter="url(#plannerShadow)" transform="translate(96, 80)">
    <!-- Outer dark teal layered background shape -->
    <rect x="0" y="20" width="320" height="340" rx="44" fill="#065f46" />
    <rect x="12" y="32" width="296" height="316" rx="36" fill="#0f766e" />
    
    <!-- Main White/Light Blue Calendar Body -->
    <rect x="24" y="56" width="272" height="280" rx="28" fill="#f8fafc" />
    
    <!-- Top Header Banner -->
    <path d="M 24 84 A 28 28 0 0 1 52 56 L 268 56 A 28 28 0 0 1 296 84 L 296 128 L 24 128 Z" fill="#bae6fd" />
    
    <!-- 5 Binding Rings -->
    <g fill="#0f766e">
      <rect x="64" y="36" width="12" height="32" rx="6" />
      <rect x="104" y="36" width="12" height="32" rx="6" />
      <rect x="144" y="36" width="12" height="32" rx="6" />
      <rect x="184" y="36" width="12" height="32" rx="6" />
      <rect x="224" y="36" width="12" height="32" rx="6" />
    </g>

    <!-- Green Leaves at Top Right -->
    <g transform="translate(220, 10)">
      <!-- Leaf 1 -->
      <path d="M 30 20 Q 50 0 60 20 Q 50 40 30 20 Z" fill="#4ade80" stroke="#166534" stroke-width="4" stroke-linejoin="round" />
      <path d="M 45 10 Q 50 20 55 15" fill="none" stroke="#166534" stroke-width="3" stroke-linecap="round" />
      
      <!-- Leaf 2 -->
      <path d="M 10 35 Q 35 25 40 45 Q 20 55 10 35 Z" fill="#86efac" stroke="#166534" stroke-width="4" stroke-linejoin="round" />
      <path d="M 25 32 Q 30 38 35 36" fill="none" stroke="#166534" stroke-width="3" stroke-linecap="round" />

      <!-- Leaf 3 -->
      <path d="M 25 55 Q 45 45 50 65 Q 30 75 25 55 Z" fill="#22c55e" stroke="#166534" stroke-width="4" stroke-linejoin="round" />
      <path d="M 38 52 Q 42 60 46 58" fill="none" stroke="#166534" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Checkmark in rounded box -->
    <g transform="translate(48, 156)">
      <rect x="0" y="0" width="72" height="72" rx="20" fill="#ccfbf1" stroke="#0d9488" stroke-width="3" />
      <path d="M 18 36 L 30 48 L 54 22" fill="none" stroke="#0d9488" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Lines on right of checkmark -->
    <g transform="translate(136, 168)">
      <rect x="0" y="0" width="120" height="12" rx="6" fill="#1e293b" />
      <rect x="0" y="28" width="80" height="12" rx="6" fill="#64748b" />
    </g>

    <!-- Bottom Line Item and Clock -->
    <g transform="translate(48, 252)">
      <rect x="0" y="12" width="110" height="12" rx="6" fill="#64748b" />
      
      <!-- Clock icon circle -->
      <g transform="translate(156, -6)">
        <circle cx="28" cy="28" r="28" fill="#e0f2fe" stroke="#0284c7" stroke-width="4" />
        <path d="M 28 14 L 28 28 L 38 34" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>
  </g>
</svg>
